<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vikara Chess | Modern Chess Intelligence</title>
    
    <!-- Dependencies -->
    <script src="./lib/chess.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="./lib/chessboardjs/css/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
</head>

<body>
    <div class="app-container">
        <header>
            <div class="brand">
                <h1>VIKARA CHESS</h1>
            </div>
            <div class="status-bar">
                <span id="total_players">Players Online: 0</span>
            </div>
        </header>

        <main class="main-layout" id="main-element">
            <section class="board-section">
                <div id="myBoard"></div>
            </section>

            <aside class="sidebar">
                <div class="card" id="timerCard">
                    <div class="card-title">Match Time</div>
                    <div id="timerDisplay">--:--</div>
                </div>

                <div class="card" id="statusCard">
                    <div class="card-title">Game Status</div>
                    <div class="game-info">
                        <div id="status">White to move</div>
                        <div id="yaps" class="display-none"></div>
                    </div>
                </div>

                <div class="card" id="controlsCard">
                    <div class="card-title">New Game</div>
                    <div class="controls" id="buttonsParent">
                        <button data-time="10" class="btn timer-button">10 Minutes</button>
                        <button data-time="15" class="btn timer-button">15 Minutes</button>
                        <button data-time="20" class="btn timer-button">20 Minutes</button>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-title">Notation</div>
                    <div id="pgn" style="max-height: 100px; overflow-y: auto; font-size: 0.8rem; color: var(--text-secondary);"></div>
                </div>
            </aside>
        </main>

        <div id="waiting_text_p" class="display-none">
            <p>Searching for opponent...</p>
        </div>
    </div>

    <script src="./lib/chessboardjs/js/chessboard-1.0.0.min.js"></script>
    <script src="./script.js"></script>
</body>

</html>
